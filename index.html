<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#123f63">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.png">
<title>Baustelle – Meyer</title>
<style>
:root{--b:#123f63;--b2:#1f6fb5;--ha:#3aa0a8;--g:#e9eef2;--t:#1c2a35;--gut:#1e8a4c;--warn:#d32f2f;--or:#ef6c00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:18px/1.35 system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--t);background:#f4f6f8}
header{position:sticky;top:0;z-index:5;background:var(--b);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:1px solid #fff8;color:#fff;border-radius:8px;padding:6px 12px;font-size:16px}
main{padding:14px;max-width:1100px;margin:auto}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.k{position:relative;background:#fff;border:2px solid #d6dde2;border-radius:14px;padding:14px 12px;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:4px;
   cursor:pointer;user-select:none;transition:transform .12s,box-shadow .2s,border-color .2s,background .2s;animation:rein .35s both}
.k:active{transform:scale(.95)}
.k.an{border-color:var(--b2);background:#e8f1fb;box-shadow:0 4px 14px #1f6fb533}
.k.an::after{content:"✓";position:absolute;right:10px;top:6px;font-size:22px;color:var(--b2);animation:plopp .3s}
.k .gross{font-size:30px}.k .klein{font-size:13px;color:#5d6b76}.k b{font-size:17px}
.k.fertig{border-color:var(--gut)}.k.fertig::before{content:"●";position:absolute;right:10px;top:6px;color:var(--gut)}
.k.ha{border-left:8px solid var(--ha)}.k.sl{border-left:8px solid var(--b2)}
@keyframes rein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes plopp{from{transform:scale(0)}to{transform:scale(1)}}
h2{margin:18px 0 10px;font-size:21px}
.leiste{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
button.h,button.n{font-size:18px;border-radius:10px;padding:12px 18px;border:0;background:var(--b2);color:#fff}
button.n{background:#fff;color:var(--b);border:2px solid var(--b)}
button:disabled{opacity:.4}
input,textarea,select{font:inherit;padding:10px;border:2px solid #cfd8de;border-radius:10px;width:100%;background:#fff}
label{display:block;font-size:14px;color:#5d6b76;margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #cfd8de;background:#fff;border-radius:22px;padding:8px 14px;font-size:16px}
.chip.an{background:var(--b2);border-color:var(--b2);color:#fff}
.karte{background:#fff;border-radius:14px;padding:14px;margin:12px 0;border:1px solid #dde3e8}
.grau{color:#5d6b76;font-size:15px}
.hinweis{background:#fff4e5;border-left:5px solid var(--or);padding:10px;border-radius:8px;margin:8px 0;font-size:16px}
.fehler{background:#fdecec;border-left:5px solid var(--warn);padding:10px;border-radius:8px;margin:8px 0;font-size:16px}
.ok{background:#e7f6ec;border-left:5px solid var(--gut);padding:10px;border-radius:8px;margin:8px 0;font-size:16px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 14px}
.fortschritt{height:8px;background:var(--g);border-radius:4px;overflow:hidden;margin:6px 0 12px}.fortschritt i{display:block;height:100%;background:var(--ha);transition:width .4s}
.wiz{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:800px){.wiz{grid-template-columns:1fr}}
.fotos{display:flex;gap:8px;flex-wrap:wrap}.fotos img{height:90px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;z-index:9;animation:rein .3s}
.skizze{position:relative;touch-action:none;max-width:700px}.skizze img{width:100%;display:block}.skizze .r{position:absolute;border:3px solid var(--warn);background:#d32f2f33}
.regel{background:var(--b);color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;margin:8px 0}
svg text{font-family:Arial}
</style></head>
<body><header><h1 id="titel">Baustelle</h1><span id="kopfr"></span></header><main id="m"></main>
<script>
"use strict";
/* ---------- Speicher (nur auf diesem Tablet) ---------- */
const DB={db:null,async auf(){if(this.db)return this.db;this.db=await new Promise((ok,f)=>{const r=indexedDB.open("baustelle",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>f(r.error)});return this.db},
 async get(k){const d=await this.auf();return new Promise(ok=>{const r=d.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(undefined)})},
 async set(k,v){const d=await this.auf();return new Promise((ok,f)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=ok;t.onerror=()=>f(t.error)})},
 async del(k){const d=await this.auf();return new Promise(ok=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=ok})}};
let PAKET=null,POLIER="",MELD=[],AKT=null;           // AKT = aktuelle Meldung
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const heute=()=>new Date().toISOString().slice(0,10),dt=i=>i?i.slice(8,10)+"."+i.slice(5,7)+"."+i.slice(0,4):"";
const zahl=s=>{if(s===undefined||s===null)return null;const t=String(s).replace(",",".").trim();if(!t)return null;const n=Number(t);return isFinite(n)?n:null},fz=(n,s=2)=>n===null||n===undefined||!isFinite(n)?"":n.toFixed(s).replace(".",",");
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
async function sichern(){if(AKT){AKT.geaendert=new Date().toISOString();const i=MELD.findIndex(x=>x.id===AKT.id);if(i<0)MELD.unshift(AKT);else MELD[i]=AKT}await DB.set("meldungen",MELD)}
function gps(){return new Promise(ok=>{if(!navigator.geolocation)return ok(null);navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),gen:Math.round(p.coords.accuracy)}),()=>ok(null),{enableHighAccuracy:true,timeout:8000,maximumAge:60000})})}
const km=(a,b)=>{const r=Math.PI/180,x=(b.lon-a.lon)*r*Math.cos((a.lat+b.lat)/2*r),y=(b.lat-a.lat)*r;return Math.sqrt(x*x+y*y)*6371};
function kopf(t,zurueck){$("#titel").textContent=t;$("#kopfr").innerHTML=zurueck?`<button onclick="${zurueck}">← Zurück</button>`:`<button onclick="datenLaden()">Daten laden</button>`;scrollTo(0,0)}

/* ---------- Start ---------- */
async function start(){PAKET=await DB.get("paket")||null;POLIER=await DB.get("polier")||"";MELD=await DB.get("meldungen")||[];
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!PAKET)return ersteSchritte();if(!POLIER)return polierWaehlen();home()}
function ersteSchritte(){kopf("Einrichten");$("#m").innerHTML=`<div class="karte"><h2>Willkommen</h2><p>Das Büro legt die Datei <b>SN-Tablet-Daten.json</b> im OneDrive-Ordner ab. Öffnen Sie sie hier einmal – danach kennt die App Aufträge, Mitarbeiter und Geräte.</p>
  <button class="h" onclick="datenLaden()">Datei aus OneDrive öffnen</button><p class="grau">Alle Eingaben bleiben auf diesem Tablet, bis Sie sie selbst senden.</p></div>`}
function datenLaden(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json,text/plain";i.onchange=async()=>{try{const p=JSON.parse(await i.files[0].text());
  if(p.typ!=="sn-tablet-daten")throw new Error("Das ist nicht die Datei SN-Tablet-Daten.json.");PAKET=p;await DB.set("paket",p);toast(`Daten vom ${dt(p.erstellt.slice(0,10))} geladen: ${p.auftraege.length} Aufträge`);POLIER?home():polierWaehlen()}catch(e){alert(e.message)}};i.click()}
function polierWaehlen(){kopf("Wer sind Sie?");$("#m").innerHTML=`<p class="grau">Einmal auswählen – das Tablet merkt es sich.</p><div class="kacheln">${PAKET.mitarbeiter.map(m=>`<div class="k" onclick="polierSetzen('${esc(m.name)}')"><span class="gross">👷</span><b>${esc(m.name)}</b><span class="klein">${esc(m.beruf||"")}</span></div>`).join("")}</div>`}
async function polierSetzen(n){POLIER=n;await DB.set("polier",n);home()}

async function home(){AKT=null;kopf("Baustelle – "+POLIER);const pos=await gps();
  const au=[...PAKET.auftraege].map(a=>({...a,km:pos&&a.gps?km(pos,a.gps):null})).sort((a,b)=>(a.km??1e9)-(b.km??1e9));
  const offen=MELD.filter(x=>!x.gesendet),ges=MELD.filter(x=>x.gesendet).slice(0,10);
  $("#m").innerHTML=`${offen.length?`<h2>Begonnen – noch nicht gesendet</h2><div class="kacheln">${offen.map(kachelMeldung).join("")}</div>`:""}
  <h2>Auftrag wählen – ${dt(heute())}</h2><div class="kacheln">
   <div class="k" onclick="neueMeldung(null)"><span class="gross">＋</span><b>Neuer Auftrag</b><span class="klein">noch nicht im Büro angelegt</span></div>
   ${au.map(a=>`<div class="k ${a.art==="hausanschluss"?"ha":"sl"}" onclick="neueMeldung(${a.id})"><span class="klein">${a.art==="hausanschluss"?"Hausanschluss":"Stundenlohn"}${a.km!==null?` · ${a.km<1?Math.round(a.km*1000)+" m":fz(a.km,1)+" km"}`:""}</span><b>${esc(a.bezeichnung||a.auftragsnr)}</b><span class="klein">${esc(a.projektnr)} ${esc(a.auftragsnr||"")}</span></div>`).join("")}</div>
  ${ges.length?`<h2>Zuletzt gesendet</h2><div class="kacheln">${ges.map(kachelMeldung).join("")}</div>`:""}
  <p class="grau" style="margin-top:20px">Daten vom ${dt((PAKET.erstellt||"").slice(0,10))} · <a href="#" onclick="polierWaehlen();return false">Person wechseln</a></p>`}
function kachelMeldung(x){return `<div class="k ${x.art==="hausanschluss"?"ha":"sl"} ${x.gesendet?"fertig":""}" onclick="oeffne('${x.id}')"><span class="klein">${dt(x.datum)}${x.gesendet?" · gesendet":""}</span><b>${esc(x.auftrag.bezeichnung||"Neuer Auftrag")}</b><span class="klein">${(x.kolonne||[]).length} Personen · ${(x.geraete||[]).length} Geräte</span></div>`}
async function neueMeldung(aid){const a=aid?PAKET.auftraege.find(x=>x.id===aid):null;const letzte=MELD.find(x=>x.polier===POLIER&&(x.kolonne||[]).length);
  const vorhanden=MELD.find(x=>!x.gesendet&&x.datum===heute()&&x.auftrag.id===aid&&aid);if(vorhanden)return oeffne(vorhanden.id);
  AKT={typ:"sn-meldung",v:1,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),polier:POLIER,datum:heute(),erstellt:new Date().toISOString(),
    art:a?a.art:"stundenlohn",auftrag:a?{id:a.id,projektnr:a.projektnr,auftragsnr:a.auftragsnr,bezeichnung:a.bezeichnung}:{id:null,bezeichnung:"",strasse:"",ort:""},
    kolonne:letzte?[...letzte.kolonne]:[POLIER],taetigkeit:"",geraete:[],aufbruch:null,ha:null,gps:await gps()};await sichern();uebersicht()}
async function oeffne(id){AKT=MELD.find(x=>x.id===id);uebersicht()}

/* ---------- Übersicht einer Meldung ---------- */
function uebersicht(){const a=AKT,ha=a.art==="hausanschluss";kopf(a.auftrag.bezeichnung||"Neuer Auftrag","home()");
  $("#m").innerHTML=`<div class="karte">${a.auftrag.id?`<b>${esc(a.auftrag.projektnr)} ${esc(a.auftrag.auftragsnr||"")}</b> · ${ha?"Hausanschluss":"Stundenlohn"}`:
   `<div class="raster"><div><label>Bezeichnung / Straße, Hausnummer</label><input value="${esc(a.auftrag.bezeichnung)}" oninput="AKT.auftrag.bezeichnung=this.value;sichern()"></div><div><label>Ort</label><input value="${esc(a.auftrag.ort)}" oninput="AKT.auftrag.ort=this.value;sichern()"></div></div>
   <div class="chips" style="margin-top:8px"><button class="chip ${!ha?"an":""}" onclick="AKT.art='stundenlohn';sichern();uebersicht()">Stundenlohn</button><button class="chip ${ha?"an":""}" onclick="AKT.art='hausanschluss';sichern();uebersicht()">Hausanschluss</button></div>`}
   <label>Datum</label><input type="date" value="${a.datum}" style="max-width:220px" onchange="AKT.datum=this.value;sichern()"></div>
  <div class="kacheln">
   ${kachel("👷","Wer ist dabei?",`${a.kolonne.length} Personen`,a.kolonne.length,"kolonne()")}
   ${kachel("📝","Was wird gemacht?",a.taetigkeit?a.taetigkeit.slice(0,40)+"…":"noch nichts",a.taetigkeit,"taetigkeit()")}
   ${kachel("🚜","Welche Geräte?",`${a.geraete.length} Geräte`,a.geraete.length,"geraeteW()")}
   ${kachel("📷","Aufbruch",a.aufbruch?`${fz(flaeche())} m² · ${(a.aufbruch.fotos||[]).length} Fotos`:"kein Aufbruch",a.aufbruch,"aufbruch()")}
   ${ha?kachel("📐","Hausanschluss-Skizze",a.ha?`Schritt ${Math.min(a.ha.schritt+1,SCHRITTE.length)} von ${SCHRITTE.length}`:"starten",a.ha&&a.ha.fertig,"haStart()"):""}
  </div>
  <div class="leiste" style="margin-top:22px"><button class="h" onclick="senden()">📤 An das Büro senden</button>${a.gesendet?`<span class="grau">gesendet am ${dt(a.gesendet.slice(0,10))} – erneut senden ersetzt nichts im Büro, es kommt als neue Meldung an.</span>`:""}
   <button class="n" onclick="loeschen()">Löschen</button></div>`}
function kachel(ic,t,u,fertig,klick){return `<div class="k ${fertig?"fertig":""}" onclick="${klick}"><span class="gross">${ic}</span><b>${t}</b><span class="klein">${esc(u)}</span></div>`}
async function loeschen(){if(!confirm("Diese Meldung auf dem Tablet löschen?"))return;MELD=MELD.filter(x=>x.id!==AKT.id);await DB.set("meldungen",MELD);home()}

/* ---------- Kolonne, Tätigkeit, Geräte ---------- */
function kolonne(){kopf("Wer ist dabei?","uebersicht()");const k=AKT.kolonne;
  $("#m").innerHTML=`<p class="grau">Antippen = dabei. Die Stunden kommen aus der Zeiterfassung.</p><div class="kacheln">${PAKET.mitarbeiter.map(m=>`<div class="k ${k.includes(m.name)?"an":""}" onclick="umschalten(AKT.kolonne,'${esc(m.name)}',this)"><span class="gross">${m.name===POLIER?"⭐":"👷"}</span><b>${esc(m.name)}</b><span class="klein">${esc(m.beruf||"")}</span></div>`).join("")}</div>
  <div class="leiste"><button class="h" onclick="uebersicht()">Fertig</button></div>`}
function umschalten(liste,w,el){const i=liste.indexOf(w);if(i<0)liste.push(w);else liste.splice(i,1);el.classList.toggle("an");sichern()}
function taetigkeit(){kopf("Was wird gemacht?","uebersicht()");
  $("#m").innerHTML=`<textarea id="tt" rows="4" oninput="AKT.taetigkeit=this.value;sichern()">${esc(AKT.taetigkeit)}</textarea>
  <h2>Antippen zum Einfügen</h2><div class="chips">${(PAKET.bausteine||[]).map((t,i)=>`<button class="chip" onclick="baustein(${i})">${esc(t)}</button>`).join("")}</div>
  <div class="leiste"><button class="h" onclick="uebersicht()">Fertig</button></div>`}
function baustein(i){const t=PAKET.bausteine[i],a=AKT.taetigkeit.trim();AKT.taetigkeit=a?a.replace(/[;\s]+$/,"")+"; "+t:t;$("#tt").value=AKT.taetigkeit;sichern()}
const istTransporter=g=>/transporter/i.test(g.kurztext||g.text||"");
const SYM=t=>/bagger/i.test(t)?"🚜":/lkw|unimog/i.test(t)?"🚚":/transporter/i.test(t)?"🚐":/pumpe/i.test(t)?"💧":/aggregat|strom|beleucht/i.test(t)?"⚡":/kompressor|hammer/i.test(t)?"🔨":/platte|stampfer|walze/i.test(t)?"⬛":/säge|schneid|trenn|fräse/i.test(t)?"🪚":/verbau/i.test(t)?"🧱":/kamera/i.test(t)?"📹":"🔧";
function geraeteW(){kopf("Welche Geräte?","uebersicht()");const zuletzt=[...new Set(MELD.filter(x=>x.polier===POLIER).flatMap(x=>x.geraete.map(g=>g.pos)))];
  const L=[...PAKET.geraete].sort((a,b)=>(zuletzt.indexOf(a.pos)<0?999:zuletzt.indexOf(a.pos))-(zuletzt.indexOf(b.pos)<0?999:zuletzt.indexOf(b.pos)));
  $("#m").innerHTML=`<p class="grau">Antippen = benutzt. Stunden sind freiwillig – leer lassen, wenn das Büro sie eintragen soll. Der Transporter bekommt automatisch die längste Mitarbeiterzeit.</p>
  <div class="kacheln">${L.map(g=>{const s=AKT.geraete.find(x=>x.pos===g.pos);return `<div class="k ${s?"an":""}" onclick="geraetTipp('${g.pos}')"><span class="gross">${SYM(g.kurztext)}</span><b style="font-size:15px">${esc(g.formulartext||g.kurztext)}</b><span class="klein">${g.pos}${s?" · "+(istTransporter(g)?"Stunden automatisch":s.stunden?fz(s.stunden)+" h":"Stunden: Büro"):""}</span></div>`}).join("")}</div>
  <div id="std"></div><div class="leiste"><button class="h" onclick="uebersicht()">Fertig</button></div>`}
function geraetTipp(pos){const g=PAKET.geraete.find(x=>x.pos===pos),s=AKT.geraete.find(x=>x.pos===pos);
  if(!s){AKT.geraete.push({pos,text:g.formulartext||g.kurztext,stunden:null,auto_max:istTransporter(g)});sichern();if(istTransporter(g))return geraeteW()}
  else if(istTransporter(g)){AKT.geraete=AKT.geraete.filter(x=>x.pos!==pos);sichern();return geraeteW()}
  geraeteW();const z=AKT.geraete.find(x=>x.pos===pos);
  $("#std").innerHTML=`<div class="karte"><b>${esc(z.text)}</b> – Stunden (freiwillig)<div class="chips" style="margin-top:8px">${[null,0.5,1,2,3,4,6,8].map(h=>`<button class="chip ${z.stunden===h?"an":""}" onclick="std('${pos}',${h})">${h===null?"Büro trägt ein":fz(h,1)+" h"}</button>`).join("")}</div>
   <div class="leiste"><button class="n" onclick="AKT.geraete=AKT.geraete.filter(x=>x.pos!=='${pos}');sichern();geraeteW()">Gerät entfernen</button></div></div>`;$("#std").scrollIntoView({behavior:"smooth"})}
function std(pos,h){AKT.geraete.find(x=>x.pos===pos).stunden=h;sichern();geraeteW()}

/* ---------- Fotos ---------- */
function foto(){return new Promise(ok=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.capture="environment";
  i.onchange=async()=>{const f=i.files[0];if(!f)return ok(null);const bild=await createImageBitmap(f),s=Math.min(1,1600/Math.max(bild.width,bild.height)),c=document.createElement("canvas");
   c.width=Math.round(bild.width*s);c.height=Math.round(bild.height*s);c.getContext("2d").drawImage(bild,0,0,c.width,c.height);ok({data:c.toDataURL("image/jpeg",0.7),zeit:new Date().toISOString(),gps:await gps()})};i.click()})}

/* ---------- Aufbruch ---------- */
const LAGE=[["fahrbahn","Fahrbahn"],["berme","Berme"],["gehweg","Gehweg"],["schutzstreifen","Schutzstreifen"],["radweg","Radweg"],["fussgaengerzone","Fußgängerzone"],["gruenflaeche","Grünfläche"]];
const OBER=[["schwarzdecke","Asphalt"],["pflaster","Pflaster"],["schotter","Schotter"],["mutterboden","Mutterboden/Rasen"]];
const flaeche=()=>{const a=AKT.aufbruch;return a?(zahl(a.laenge)||0)*(zahl(a.breite)||0):0};
function aufbruch(){kopf("Aufbruch","uebersicht()");const a=AKT.aufbruch;
  if(!a){$("#m").innerHTML=`<div class="kacheln"><div class="k" onclick="AKT.aufbruch={lage:[],ober:[],laenge:'',breite:'',aufbau:'',rechtecke:[],fotos:[],wie_vorher:false,notpflaster:false};sichern();aufbruch()"><span class="gross">⛏️</span><b>Es gibt einen Aufbruch</b></div>
    <div class="k" onclick="uebersicht()"><span class="gross">✋</span><b>Kein Aufbruch</b></div></div>`;return}
  $("#m").innerHTML=`<h2>1. Foto der Aufbruchfläche</h2><div class="fotos">${a.fotos.map((f,i)=>`<img src="${f.data}" onclick="if(confirm('Foto entfernen?')){AKT.aufbruch.fotos.splice(${i},1);sichern();aufbruch()}">`).join("")}</div>
   <div class="leiste"><button class="h" onclick="aufbruchFoto()">📷 Foto machen</button></div>
  <h2>2. Wo?</h2><div class="chips">${LAGE.map(([k,t])=>`<button class="chip ${a.lage.includes(k)?"an":""}" onclick="umschalten(AKT.aufbruch.lage,'${k}',this)">${t}</button>`).join("")}</div>
  <h2>3. Oberfläche</h2><div class="chips">${OBER.map(([k,t])=>`<button class="chip ${a.ober.includes(k)?"an":""}" onclick="umschalten(AKT.aufbruch.ober,'${k}',this)">${t}</button>`).join("")}</div>

   ${h.m1?`<line x1="${su}" y1="${K-w*12}" x2="${x}" y2="${K-w*12}" stroke="#777"/>${lab((su+x)/2,K-w*18+(o?0:8),"← "+h.m1+" m (gegen Fließr.)")}`:""}
   <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#000" stroke-width="3"/>${pts.slice(1,-1).map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4"/>${lab(p[0]+(lr||1)*10,p[1]+4,h.boegen[i].winkel+"°",lr<0?"end":"start")}`).join("")}
   ${h.schacht!=="ohne"?`<circle cx="${pts[pts.length-1][0]}" cy="${ey}" r="9" fill="#fff" stroke="#000" stroke-width="2.5"/>${lab(pts[pts.length-1][0]+14,ey+4,h.t?"T "+h.t+" m":"","start")}`:h.ms?lab(pts[pts.length-1][0]+8,ey,"MS","start"):""}
   ${lab((x+p1[0])/2-(lr>0?-10:10),(K+p1[1])/2,h.anschluss,lr>0?"start":"end")}${h.absturz?lab(x+(lr<0?-12:12),K-w*40,"Absturz "+(h.absturz.hoehe||"?")+" m",lr<0?"end":"start"):""}
   ${tk!==null?lab(x,K+w*40+4,"Sohle "+fz(tk)+" m"+(zahl(h.tk)===null?" (err.)":"")):""}
   ${e2?lab(10,o?372:14,`Schacht eingemessen: ${fz(e2.a)} / ${fz(e2.b)} m ab Hausecke`,"start"):""}</svg><p class="grau">Schematische Vorschau – das Büro bekommt eine bearbeitbare Skizze.</p>`}

/* ---------- Senden ---------- */
async function senden(){const a=AKT;if(!a.auftrag.id&&!a.auftrag.bezeichnung.trim())return alert("Bitte eine Bezeichnung für den neuen Auftrag eintragen.");
  if(!a.kolonne.length&&!confirm("Niemand bei „Wer ist dabei?“ ausgewählt. Trotzdem senden?"))return;
  a.gesendet_am=new Date().toISOString();const name=`SN-Meldung_${POLIER.replace(/[^\wäöüÄÖÜß-]+/g,"_")}_${a.datum}_${a.id}`;const text=JSON.stringify(a);
  const versuche=[[name+".json","application/json"],[name+".txt","text/plain"]];
  for(const [n,t] of versuche){const f=new File([text],n,{type:t});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:n});a.gesendet=a.gesendet_am;await sichern();toast("Gesendet – bitte im OneDrive-Ordner ablegen.");return uebersicht()}catch(e){if(e.name==="AbortError")return}}}
  const u=URL.createObjectURL(new Blob([text],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download=name+".json";l.click();a.gesendet=a.gesendet_am;await sichern();
  alert("Die Meldung wurde unter „Downloads“ gespeichert. Bitte in der OneDrive-App in den Austauschordner hochladen.");uebersicht()}
start();
</script></body></html>
